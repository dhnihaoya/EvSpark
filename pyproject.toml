[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evspark"
version = "0.1.0"
description = "Lossless speculative decoding for Evo2 (StripedHyena2 DNA foundation models)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "torch>=2.7",
    "evo2",  # pulls vortex (vtx); flash-attn must match your torch build, see README §Install
]

[project.optional-dependencies]
modelscope = ["modelscope"]  # checkpoint mirror (recommended where huggingface.co is unreachable)
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/dhnihaoya/EvSpark"
Paper = "https://www.biorxiv.org/content/10.64898/2026.09.02.749017v1"
DOI = "https://doi.org/10.64898/2026.09.02.749017"
HuggingFace = "https://huggingface.co/dinghhhhhhhhhhhhhhh/EvSpark"
ModelScope = "https://www.modelscope.cn/models/dinghao1120/EvSpark"

[tool.setuptools.packages.find]
include = ["evspark*"]

[tool.setuptools.package-data]
evspark = ["data/*.json"]
